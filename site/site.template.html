<title>Megan Lee Photography</title>
<style>
  /* A deliberately light, airy brand world — ivory paper, plum ink, lavender and
     sage in equal partnership, gold as the one metallic. Single-theme by design:
     the palette IS the brand. Greens and gold are sampled from Megan's moodboards
     (swatch strip: #40553e #7d8e7b #927092 #c8a2c8 #d6c1d0; gold #b19d83). */
  :root {
    --paper: #fbf9f5;
    --ink: #3e3649;
    --ink-soft: #7a7086;
    --lav: #a48fc4;
    --lav-deep: #7c689c;
    --lav-wash: #efeaf6;
    --orchid: #c8a2c8;
    /* the green half of the palette — sage was a near-white tint before and went unused */
    --green-deep: #40553e;
    --sage: #7d8e7b;
    --sage-deep: #5f7260;
    --sage-wash: #eaeee6;
    /* the one metallic */
    --gold: #b19d83;
    --gold-deep: #756345; /* darkened from the board's #b19d83 to clear 4.5:1 on both washes */
    --gold-wash: #f4eee3;
    --rule: #e2dbea;
    --rule-sage: #d9e0d4;
    --serif: Didot, "Bodoni MT", "Playfair Display", "Hoefler Text", Georgia, serif;
    --sans: "Avenir Next", Avenir, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    /* mono carries the editorial furniture — eyebrows, captions, nav, index numbers */
    --mono: ui-monospace, "SF Mono", "IBM Plex Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16.5px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--lav-deep); }
  img, svg { max-width: 100%; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.64rem;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--sage-deep);
  }
  h1, h2, h3 { font-family: var(--serif); font-weight: 500; text-wrap: balance; margin: 0; }
  /* display type is the whole personality here — big, tight, set close */
  h1 { font-size: clamp(2.8rem, 6.4vw, 5.6rem); line-height: 0.96; letter-spacing: -0.03em; }
  h2 { font-size: clamp(2rem, 4.6vw, 3.6rem); line-height: 1.0; letter-spacing: -0.028em; }
  h3 { font-size: 1.25rem; letter-spacing: -0.012em; }
  /* lowercase on the display line reads current. .page-title opts in; the About h1
     deliberately does not, because lowercasing "Hi, I'm Megan." lowercases her name */
  .hero h1, section h2, .page-title { text-transform: lowercase; }
  .page-title { font-size: clamp(2.6rem, 5.6vw, 4.6rem); }
  .lede { font-size: 1.1rem; color: var(--ink-soft); max-width: 56ch; }
  em.serif { font-family: var(--serif); font-style: italic; }

  /* ---------- nav ---------- */
  nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(251, 249, 245, 0.88);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--rule);
  }
  .nav-in {
    max-width: 1120px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
  }
  .brand { display: block; flex: none; }
  .brand img { display: block; height: 44px; width: auto; }
  .brand:focus-visible { outline: 2px solid var(--lav); outline-offset: 3px; border-radius: 4px; }
  @media (max-width: 560px) { .brand img { height: 36px; } }
  .nav-links { display: flex; gap: 4px; flex-wrap: wrap; }
  .nav-links a {
    text-decoration: none;
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 9px 14px;
    border-radius: 999px;
  }
  .nav-links a:hover { color: var(--ink); background: var(--lav-wash); }
  .nav-links a.on { color: var(--ink); background: var(--lav-wash); }
  .nav-links a:focus-visible { outline: 2px solid var(--lav); outline-offset: 2px; }

  /* ---------- shared layout ---------- */
  main { min-height: 70vh; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  section { padding: 72px 0; }
  section.tight { padding: 48px 0; }
  .rule-top { border-top: 1px solid var(--rule); }

  .btn {
    display: inline-block;
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-decoration: none;
    padding: 13px 26px;
    border-radius: 999px;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    background: transparent;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .btn.solid:hover { background: var(--lav-deep); border-color: var(--lav-deep); }
  .btn.quiet { border-color: var(--rule); color: var(--ink-soft); }
  .btn.quiet:hover { border-color: var(--ink); color: var(--ink); background: transparent; }
  .btn:focus-visible { outline: 2px solid var(--lav); outline-offset: 3px; }

  /* ---------- placeholder frames ---------- */
  figure.ph { margin: 0; }
  figure.ph .art {
    border-radius: 2px;
    overflow: hidden;
    display: block;
    box-shadow: 0 1px 2px rgba(62, 54, 73, 0.08), 0 12px 32px rgba(62, 54, 73, 0.09);
  }
  figure.ph .art svg { display: block; width: 100%; height: auto; }
  figure.ph figcaption {
    margin-top: 11px;
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  figure.ph figcaption i { font-style: normal; }
  figure.ph figcaption small { font-size: 0.6rem; align-self: center; opacity: 0.62; }

  /* ---------- home hero ---------- */
  .hero { padding: 96px 0 76px; overflow: hidden; }
  /* the hero breaks the container: copy holds the page's left rail, images run off the right edge */
  .hero .wrap {
    max-width: none;
    padding-left: max(24px, calc((100vw - 1120px) / 2));
    padding-right: 0;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: minmax(0, 6fr) minmax(0, 5fr);
    gap: 52px;
    align-items: center;
  }
  .hero-copy { display: flex; flex-direction: column; gap: 22px; align-items: flex-start; }
  .hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
  .hero-note { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
  .collage {
    position: relative;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  /* staggered, and the third genuinely overlaps the two above it */
  .collage figure:nth-child(1) { transform: translateY(54px); }
  .collage figure:nth-child(2) { transform: translateY(-16px); }
  .collage figure:nth-child(3) {
    grid-column: 1 / -1;
    width: 58%;
    margin: -20% 0 0 6%;
    position: relative;
    z-index: 2;
  }
  /* captions would collide with the overlap, and the hero reads cleaner without them.
     needs to out-specify `figure.ph figcaption`, which sets display: flex */
  .collage figure.ph figcaption { display: none; }

  @media (max-width: 860px) {
    .hero { padding: 56px 0 40px; }
    .hero .wrap { padding-right: 24px; }
    .hero-grid { grid-template-columns: 1fr; gap: 44px; }
    .collage figure:nth-child(1) { transform: translateY(32px); }
    section { padding: 56px 0; }
  }

  /* ---------- cards / grids ---------- */
  .head-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }
  .head-row .lede { margin: 6px 0 0; }
  /* six categories, so three across reads evenly rather than a 4 + 2 orphan row */
  .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 58px 26px; counter-reset: cat; }
  /* drop the middle column so the row reads as a run of frames, not a filing cabinet.
     keyed to the column, not :nth-child(even) — that scatters once the rows wrap */
  .cat-grid > :nth-child(3n + 2) { transform: translateY(34px); }
  /* stays two-up even on phones — six stacked full-width cards is a punishing scroll */
  @media (max-width: 940px) {
    .cat-grid { grid-template-columns: repeat(2, 1fr); gap: 44px 20px; }
    .cat-grid > :nth-child(3n + 2) { transform: none; }
    .cat-grid > :nth-child(even) { transform: translateY(26px); }
  }
  @media (max-width: 560px) {
    .cat-grid { gap: 28px 14px; }
    .cat-grid > :nth-child(even) { transform: translateY(16px); }
  }

  .cat { text-decoration: none; color: var(--ink); display: block; counter-increment: cat; }
  .cat h3 { margin: 14px 0 4px; }
  /* numbered index — the single cheapest editorial tell */
  .cat h3::before {
    content: counter(cat, decimal-leading-zero);
    display: block;
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--sage-deep);
    margin-bottom: 7px;
  }
  .cat p { margin: 0; font-size: 0.9rem; color: var(--ink-soft); }
  /* zoom inside the frame rather than nudging the whole box */
  .cat .art svg { transition: transform 0.55s cubic-bezier(0.2, 0.7, 0.3, 1); }
  .cat:hover .art svg { transform: scale(1.055); }
  .cat:focus-visible { outline: 2px solid var(--lav); outline-offset: 4px; border-radius: 4px; }

  /* ---------- dark anchor band ---------- */
  /* one full-bleed dark section stops the page being pastel the whole way down */
  section.dark {
    background: var(--green-deep);
    color: var(--paper);
    padding: 92px 0;
  }
  /* every muted tone here is picked to clear 4.5:1 on BOTH the green and the
     lighter testimonial card sitting on top of it — the card is the tighter constraint */
  section.dark .eyebrow { color: #ccd6c8; }
  section.dark h2 { color: var(--paper); }
  section.dark .hero-note, section.dark .swipe-hint { color: #ccd6c8; }
  section.dark .testi { background: rgba(251, 249, 245, 0.07); }
  section.dark .testi blockquote { color: var(--paper); }
  section.dark .testi .who b { color: var(--paper); }
  section.dark .testi .who span { color: #ccd6c8; }
  /* the board gold is far too dark to sit on green; this is its light counterpart */
  section.dark .testi .stars { color: #e0d2b8; }
  section.dark .step { border-top-color: rgba(251, 249, 245, 0.5); }
  section.dark .step:nth-child(even) { border-top-color: rgba(204, 214, 200, 0.6); }
  section.dark .step::before,
  section.dark .step:nth-child(even)::before { color: #ccd6c8; }
  section.dark .step b { color: var(--paper); }
  section.dark .step p { color: #ccd6c8; }

  /* ---------- testimonials ---------- */
  .testis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
  .testi {
    background: var(--sage-wash);
    border-radius: 2px;
    padding: 30px 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .testi .stars { color: var(--gold-deep); letter-spacing: 0.22em; font-size: 0.8rem; }
  .testi blockquote {
    margin: 0;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.08rem;
    line-height: 1.5;
  }
  .testi .who { margin-top: auto; padding-top: 6px; }
  .testi .who b { display: block; font-size: 0.9rem; font-weight: 600; }
  .testi .who span {
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--lav-deep);
  }

  /* ---------- cta band ---------- */
  .band {
    background: var(--ink);
    color: var(--paper);
    border-radius: 2px;
    padding: 56px clamp(24px, 6vw, 72px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 28px;
    flex-wrap: wrap;
  }
  .band h2 { color: var(--paper); max-width: 22ch; }
  .band p { color: #c9c0d6; margin: 8px 0 0; font-size: 0.95rem; }
  .band .btn { border-color: var(--paper); color: var(--paper); flex: none; }
  .band .btn:hover { background: var(--paper); color: var(--ink); }

  /* ---------- about ---------- */
  .about-grid {
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    gap: 60px;
    align-items: start;
  }
  @media (max-width: 860px) { .about-grid { grid-template-columns: 1fr; gap: 40px; } }
  .about-copy { display: flex; flex-direction: column; gap: 18px; }
  .about-copy p { margin: 0; max-width: 62ch; }
  .values { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 18px; }
  .values li { padding-left: 26px; position: relative; }
  .values li::before {
    content: "";
    position: absolute;
    left: 0; top: 0.55em;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--lav);
    opacity: 0.75;
  }
  .values b { display: block; font-family: var(--serif); font-weight: 500; font-size: 1.08rem; }
  .values span { font-size: 0.92rem; color: var(--ink-soft); }

  /* ---------- services ---------- */
  .pkgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; align-items: stretch; }
  .pkg {
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 34px 30px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: #fff;
  }
  .pkg.feature { background: var(--lav-wash); border-color: var(--orchid); }
  .pkg .tag {
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--lav-deep);
  }
  /* gold is the premium cue, so it marks the featured package and nothing else */
  .pkg.feature .tag { color: var(--gold-deep); }
  .pkg h3 { font-size: 1.5rem; }
  .pkg .price { font-family: var(--serif); font-size: 1.9rem; }
  .pkg .price small { font-family: var(--sans); font-size: 0.72rem; color: var(--ink-soft); letter-spacing: 0.05em; }
  .pkg p.blurb { margin: 0; font-size: 0.92rem; color: var(--ink-soft); }
  .pkg ul { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; font-size: 0.92rem; }
  .pkg ul li { padding-left: 22px; position: relative; }
  .pkg ul li::before { content: "·"; position: absolute; left: 6px; color: var(--lav-deep); font-weight: 700; }
  .pkg .btn { margin-top: auto; align-self: flex-start; }

  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; counter-reset: step; }
  @media (max-width: 940px) { .steps { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .steps { grid-template-columns: 1fr; } }
  .step { counter-increment: step; border-top: 2px solid var(--lav); padding-top: 16px; }
  /* alternate the rules lavender / sage, the way the moodboards alternate the two */
  .step:nth-child(even) { border-top-color: var(--sage); }
  .step:nth-child(even)::before { color: var(--sage-deep); }
  .step::before {
    content: "Step " counter(step);
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--lav-deep);
  }
  .step b { display: block; font-family: var(--serif); font-weight: 500; font-size: 1.15rem; margin: 6px 0 4px; }
  .step p { margin: 0; font-size: 0.9rem; color: var(--ink-soft); }

  details.faq {
    border-bottom: 1px solid var(--rule);
    padding: 4px 0;
  }
  details.faq summary {
    cursor: pointer;
    font-family: var(--serif);
    font-size: 1.12rem;
    padding: 16px 0;
    list-style: none;
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }
  details.faq summary::-webkit-details-marker { display: none; }
  details.faq summary::after { content: "+"; color: var(--lav-deep); font-size: 1.3rem; flex: none; }
  details.faq[open] summary::after { content: "–"; }
  details.faq p { margin: 0 0 18px; color: var(--ink-soft); font-size: 0.95rem; max-width: 68ch; }

  /* ---------- portfolio ---------- */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 26px 0 34px; }
  .filters button {
    font: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 8px 18px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .filters button[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  .filters button:focus-visible { outline: 2px solid var(--lav); outline-offset: 2px; }
  .masonry { columns: 3; column-gap: 22px; }
  @media (max-width: 940px) { .masonry { columns: 2; } }
  @media (max-width: 560px) { .masonry { columns: 1; } }
  .masonry figure.ph { break-inside: avoid; margin: 0 0 22px; }
  /* on small screens the caption chatter overwhelms the images — let them breathe */
  @media (max-width: 560px) {
    figure.ph figcaption { display: none; }
    .masonry figure.ph { margin-bottom: 14px; }
    .masonry { column-gap: 14px; }
    .swap-note { font-size: 0.8rem; }
  }
  .swap-note {
    background: var(--gold-wash);
    border-left: 3px solid var(--gold);
    border-radius: 2px;
    padding: 14px 20px;
    font-size: 0.85rem;
    color: #6b5647;
  }

  /* ---------- footer ---------- */
  /* sage rather than lilac, so the page closes on the green half of the palette */
  footer {
    border-top: 1px solid var(--rule-sage);
    margin-top: 40px;
    background: var(--sage-wash);
  }
  .foot-in {
    max-width: 1120px;
    margin: 0 auto;
    padding: 48px 24px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 28px;
    flex-wrap: wrap;
  }
  .foot-brand img { display: block; width: 170px; height: auto; margin: 0 auto; }
  .foot-links { display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; }
  .foot-links a { color: var(--ink-soft); text-decoration: none; }
  .foot-links a:hover { color: var(--green-deep); }
  .foot-fine { font-size: 0.72rem; color: var(--ink-soft); }

  /* ---------- mobile side-scroll rows (last so it wins over the grid layouts) ---------- */
  .swipe-hint { display: none; }
  @media (max-width: 940px) {
    .snap-row {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 16px;
      margin: 0 -24px;
      padding: 4px 24px 18px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    .snap-row > * { flex: 0 0 min(82%, 330px); scroll-snap-align: center; }
    .swipe-hint {
      display: block;
      margin: 2px 0 0;
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      text-align: center;
    }
  }

  /* ---------- reveal ---------- */
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity 0.55s ease, transform 0.55s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    html { scroll-behavior: auto; }
    .cat .art, .btn { transition: none; }
  }
</style>

<script>
(function () {

  /* ---------- placeholder frame artwork ----------

    /* opts: wash, shape (arch|sun|blob|curve|sprig), ratio [w,h], label, cat, note */

    var tone = DARK[opts.wash] || "#ffffff";
    /* the sprig is a botanical, so it reads as foliage rather than a white ghost */
    var sprigTone = DARK[opts.wash] || "#5f7260";
    var cx = w / 2, cy = h / 2;

    if (opts.shape === "arch") {
      deco = "<path d='M" + (cx - 24) + " " + (cy + 30) + " L" + (cx - 24) + " " + cy +
             " A24 24 0 0 1 " + (cx + 24) + " " + cy + " L" + (cx + 24) + " " + (cy + 30) + "'" +
             " fill='" + tone + "' fill-opacity='0.35'/>";
    } else if (opts.shape === "sun") {
      deco = "<circle cx='" + (cx + 14) + "' cy='" + (cy - 12) + "' r='16' fill='" + tone + "' fill-opacity='0.4'/>" +
             "<circle cx='" + (cx - 20) + "' cy='" + (cy + 22) + "' r='7' fill='" + tone + "' fill-opacity='0.25'/>";
    } else if (opts.shape === "blob") {
      deco = "<path d='M" + cx + " " + (cy - 22) + " C " + (cx + 26) + " " + (cy - 16) + ", " + (cx + 22) + " " + (cy + 20) + ", " +
             cx + " " + (cy + 24) + " C " + (cx - 24) + " " + (cy + 20) + ", " + (cx - 24) + " " + (cy - 12) + ", " +
             cx + " " + (cy - 22) + " Z' fill='" + tone + "' fill-opacity='0.3'/>";
    } else if (opts.shape === "curve") {
      deco = "<path d='M-5 " + (h * 0.7) + " C " + (w * 0.3) + " " + (h * 0.52) + ", " + (w * 0.7) + " " + (h * 0.88) + ", " +
             (w + 5) + " " + (h * 0.62) + "' stroke='" + tone + "' stroke-opacity='0.5' stroke-width='10' fill='none'/>";
    } else if (opts.shape === "sprig") {
      deco = "<g transform='translate(" + cx + " " + cy + ") scale(0.55)' color='" + sprigTone + "' opacity='0.55'><use href='#sprigSym'/></g>";
    }

    return "<figure class='ph' data-cat='" + (opts.cat || "") + "'>" +
      "<span class='art'>" +
      "<svg viewBox='0 0 " + w + " " + h + "' role='img' aria-label='Placeholder for a photograph — " + opts.label + "'>" +
      "<defs><linearGradient id='" + id + "' x1='0' y1='0' x2='0.7' y2='1'>" +
      "<stop offset='0' stop-color='" + g[0] + "'/><stop offset='1' stop-color='" + g[1] + "'/>" +
      "</linearGradient></defs>" +
      "<rect width='" + w + "' height='" + h + "' fill='url(#" + id + ")'/>" + deco +
      "<rect width='" + w + "' height='" + h + "' fill='transparent' filter='url(#grainF)'/>" +
      "</svg></span>" +
      "<figcaption><i>" + opts.label + "</i><small>" + (opts.note || "your photo here") + "</small></figcaption>" +
      "</figure>";
  }

      "</div></section>" +

      "<section class='tight'><div class='wrap reveal'>" +
        "<div class='band'>" +

    },

    about: function () {
      return "" +
      "<section><div class='wrap about-grid'>" +
        "<div class='reveal'>" +
          frame({ wash: "lav", shape: "sprig", ratio: [4, 5], label: "a portrait of Megan", note: "swap me in" }) +
        "</div>" +
        "<div class='about-copy reveal'>" +
          "<span class='eyebrow'>About</span>" +
          "<h1>Hi, I'm Megan.</h1>" +
          "<p>I'm the person at the party watching the grandmother laugh at the kids' table, thinking <em class='serif'>that's the photo</em>. I've been chasing moments like that since [year] — first with a hand-me-down camera, now for the families, mamas-to-be, and celebrations kind enough to let me into their big days and ordinary Tuesdays.</p>" +
          "<p>My style leans soft and true-to-life: pastel light, real color, no heavy filters that will look dated in five years. I shoot loose and edit gently, because the goal isn't to make you look like someone else — it's to make you look like yourselves on a really good day.</p>" +
          "<p>When I'm not behind the camera you'll find me [three honest details — a favorite trail, an iced-coffee order, a dog's name]. Come say hi on <a href='https://www.instagram.com/meg.lee.moments/' target='_blank' rel='noopener'>Instagram</a> — the stories are where the outtakes live.</p>" +

        "</div>" +

      "</div></section>" +

      "<section class='dark'><div class='wrap'>" +
        "<div class='head-row reveal'><div><span class='eyebrow'>How it works</span><h2>From hello to hung-on-the-wall.</h2></div></div>" +
        "<div class='steps reveal'>" +
          "<div class='step'><b>Say hello</b><p>Send a note with your date and what you're dreaming up. I'll reply within two days.</p></div>" +
          "<div class='step'><b>Plan the good part</b><p>We'll pick a spot and a time with the best light, and I'll send a short what-to-wear guide.</p></div>" +
          "<div class='step'><b>The session</b><p>We walk, you laugh, I work. It feels less like a photoshoot and more like a hangout.</p></div>" +

        "</div>" +

      "<section class='rule-top'><div class='wrap' style='max-width: 800px'>" +
        "<div class='head-row reveal'><div><span class='eyebrow'>FAQ</span><h2>Asked often, answered honestly.</h2></div></div>" +
        "<div class='reveal'>" +
        "<details class='faq'><summary>What should we wear?</summary><p>Soft, muted tones photograph beautifully with my editing style — creams, dusty pastels, earth tones. Avoid neon and big logos. Booked clients get a full styling guide.</p></details>" +
        "<details class='faq'><summary>Our kids won't cooperate. Is that a problem?</summary><p>It's expected, honestly. The wiggles and the meltdown-averted-by-a-snack are half the story. I shoot around it, and those often end up being the favorite frames.</p></details>" +
        "<details class='faq'><summary>How do we get our photos?</summary><p>Through a private online gallery you can download, share, and order prints from. Sneak peeks arrive within 48 hours of your session.</p></details>" +
        "<details class='faq'><summary>Do you travel?</summary><p>Happily. Sessions within [X miles] of [Your City] are included; beyond that I add a simple travel fee — and I've never once regretted a road trip for good light.</p></details>" +
        "<details class='faq'><summary>What if it rains?</summary><p>We watch the forecast together and reschedule for free if it turns. That said — overcast light is gorgeous and misty photos are criminally underrated.</p></details>" +

    portfolio: function () {
      var shots = [
        { wash: "sage", shape: "sun", ratio: [4, 5], label: "sunday at grandma's", cat: "family" },

        { wash: "plum", shape: "sprig", ratio: [4, 5], label: "last dance of the night", cat: "events" },

        { wash: "lav", shape: "curve", ratio: [5, 4], label: "the whole crew", cat: "family" },

  /* ---------- router ---------- */
  var app = document.getElementById("app");
  var navLinks = document.getElementById("navLinks");

  function route() {
    var r = (location.hash.replace(/^#\/?/, "") || "home").split("?")[0];
    if (!PAGES[r]) r = "home";
    frameId = 0;
    app.innerHTML = PAGES[r]();
    navLinks.querySelectorAll("a").forEach(function (a) {
      a.classList.toggle("on", a.dataset.r === r);
    });
    document.title = "Megan Lee Photography" + (r === "home" ? "" : " — " + r.charAt(0).toUpperCase() + r.slice(1));
    window.scrollTo(0, 0);
    wirePage(r);
    observeReveals();
  }

  function wirePage(r) {
    if (r !== "portfolio") return;
    var filters = document.getElementById("filters");
    var masonry = document.getElementById("masonry");
    filters.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-f]");
      if (!btn) return;
      filters.querySelectorAll("button").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b === btn));
      });
      var f = btn.dataset.f;
      masonry.querySelectorAll("figure.ph").forEach(function (fig) {
        fig.style.display = (f === "all" || fig.dataset.cat === f) ? "" : "none";
      });
    });
    /* honor #/portfolio?f=family style links from the category cards */
    var pre = (/[?&]f=([a-z]+)/.exec(location.hash) || [])[1];
    if (pre) {
      var btn = filters.querySelector("button[data-f='" + pre + "']");
      if (btn) btn.click();
    }
  }

  var io = null;
  function observeReveals() {
    if (io) io.disconnect();
    var els = document.querySelectorAll(".reveal");
    if (!("IntersectionObserver" in window) ||
        window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      els.forEach(function (el) { el.classList.add("in"); });
      return;
    }
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
      });
    }, { threshold: 0.12 });
    els.forEach(function (el) { io.observe(el); });
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>
